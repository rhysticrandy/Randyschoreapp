<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1018"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Guardian Reset</title><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0d1018;--card:#171c27;--card2:#1d2432;--ink:#f1f3f7;--muted:#9ca6b7;--line:#2c3546;--accent:#d8a93e;--blue:#5fa8e8;--green:#68b58b;--danger:#c66d6d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#26334a 0,#0d1018 42%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:86px;min-height:100vh}
header{padding:17px 17px 13px;background:rgba(13,16,24,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:24px;letter-spacing:.3px}.date{color:var(--muted);font-size:13px;margin-top:4px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--accent);font-weight:800}
main{max-width:720px;margin:auto;padding:12px}.card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 8px 25px #0005}
h2{font-size:17px;margin:2px 0 7px}h3{font-size:14px;margin:13px 0 5px}.small{font-size:12px;color:var(--muted)}
.glimmer{color:var(--accent);font-weight:800}.hero{display:flex;justify-content:space-between;align-items:center;gap:12px}.balance{font-size:29px;font-weight:850}.rank{font-size:13px;color:var(--blue);font-weight:800}
.progress{height:9px;background:#0a0d13;border-radius:99px;overflow:hidden;margin:10px 0 5px}.bar{height:100%;background:linear-gradient(90deg,var(--accent),#f0d276);transition:.3s}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
input[type=checkbox]{width:21px;height:21px;accent-color:var(--accent);flex:none}.done{text-decoration:line-through;color:var(--muted)}
.tag{margin-left:auto;font-size:9px;padding:4px 6px;border-radius:7px;background:#2b3444;color:#b8c5d9}.reward{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
button{font:inherit}.primary{background:var(--accent);color:#151515;border:0;border-radius:9px;padding:9px 12px;font-weight:800}.secondary{background:#2a3240;color:var(--ink);border:0;border-radius:9px;padding:9px 12px}.danger{background:#542d32;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
nav{position:fixed;bottom:0;left:0;right:0;background:#11151f;border-top:1px solid var(--line);z-index:9;padding:7px 5px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
nav button{border:0;background:none;color:#7f899a;font-size:10px;padding:6px 5px}.active{color:var(--accent)!important;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.stat{background:#10141d;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}.big{font-size:22px;font-weight:850}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekday{text-align:center;color:var(--muted);font-size:9px}.day{border:1px solid var(--line);border-radius:8px;min-height:62px;padding:5px;background:#121720;font-size:10px}.today{outline:2px solid var(--accent)}.dot{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin:3px 1px}
input[type=time],input[type=text],select{font-size:15px;color:var(--ink);background:#10141d;border:1px solid var(--line);border-radius:9px;padding:8px}input[type=text]{width:100%}
.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.theme{padding:12px;border:1px solid var(--line);border-radius:11px;background:#11151e}.selected{outline:2px solid var(--accent)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:#242d3b;border:1px solid #4a586d;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body>
<header><div class="eyebrow">GUARDIAN RESET</div><h1>My Chore Objectives</h1><div class="date" id="headerDate"></div></header><main id="app"></main><div id="toast" class="toast"></div>
<nav><button data-tab="today" class="active">⌂<br>Objectives</button><button data-tab="calendar">▦<br>Calendar</button><button data-tab="progress">✦<br>Progress</button><button data-tab="rewards">◇<br>Rewards</button><button data-tab="settings">⚙<br>Settings</button></nav>
<script>
const KEY="guardianResetV3";
const defaults={glimmer:0,lifetime:0,checks:{},custom:[],rewards:[
{name:"Favorite meal",cost:500,icon:"🍕"},{name:"2-hour gaming session",cost:400,icon:"🎮"},{name:"Movie night",cost:300,icon:"🎬"},{name:"Fancy coffee",cost:250,icon:"☕"},{name:"$10 fun money",cost:1000,icon:"🛍️"},{name:"Buy a new game",cost:5000,icon:"🎮"}],
claimed:{},settings:{morning:"07:30",cleaning:"18:00",plants:"18:15",night:"21:30"},theme:"guardian",mode:"dark"};
let s=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;s={...defaults,...s,settings:{...defaults.settings,...(s.settings||{})},rewards:s.rewards||defaults.rewards,checks:s.checks||{},custom:s.custom||[]};
const morning=["Drink water","Brush teeth / wash face","Make bed","Get dressed","Put dirty clothes in hamper","2-minute room tidy","Check today's tasks"];
const night=["Dishes / kitchen reset","Put clothes away","5–10 minute room reset","Brush teeth / wash face","Set out tomorrow's clothes","Check tomorrow's schedule","Plug in phone"];
const daily=[["Make bed",10],["Dishes / kitchen reset",10],["Put dirty clothes in hamper",10],["Quick room tidy",10]];
const thu=[["Laundry",30],["Change sheets",30],["Vacuum bedroom",25],["Clean bathroom",40],["Water plants",30]];
const fri=[["Deep-clean kitchen",50],["Mop floors",30],["Dust",20],["Take out trash",10],["Organize bedroom",30]];
const monthly={"2026-10-09":[["Clean fridge",75],["Clean microwave",40],["Dust vents/fans",40],["Organize desk",30]],"2026-10-16":[["Clean appliances",50],["Clean under furniture",50]],"2026-10-23":[["Organize closet",60],["Organize drawers",40],["Dust baseboards",50],["Clean mirrors/windows",45]],"2026-10-30":[["Deep-clean kitchen",75],["Deep-clean bathroom",75],["Mop all floors",50],["Dust everything",60],["Clean fridge",75],["Take out trash",10]]};
const triumphs=[
["First Light","Complete your first full day",100,d=>fullDay(d)],
["Reliable Guardian","Complete 7 consecutive days",250,d=>streakAtLeast(7,d)],
["Keeper of the Tower","Complete 100 chores",500,d=>Object.values(s.checks).filter(Boolean).length>=100],
["Gardener","Water plants 25 times",300,d=>Object.keys(s.checks).filter(k=>k.endsWith("🟢 Water plants")).length>=25],
["Clean Sweep","Complete 10 Friday resets",1000,d=>countCompletedFridays()>=10]
];
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function dk(d){return d.toISOString().slice(0,10)}function now(){return new Date()}function fmt(d){return d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}
function xpRank(){return Math.floor(s.lifetime/1000)+1}function rankNext(){return 1000-(s.lifetime%1000)}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
function tasksFor(d){let a=[...morning.map(x=>["🌅 "+x,5]),...daily.map(([x,v])=>[x,v])];if(d.getDay()===4)a.push(...thu);if(d.getDay()===5)a.push(...fri);if(monthly[dk(d)])a.push(...monthly[dk(d)].map(([x,v])=>["🧽 "+x,v]));s.custom.forEach(x=>{if(x.days.includes(d.getDay()))a.push(["⭐ "+x.name,x.value||15])});a.push(...night.map(x=>["🌙 "+x,5]));return a}
function isChecked(ds,t){return !!s.checks[ds+"|"+t]}function completeTask(ds,t,val){let k=ds+"|"+t;if(isChecked(ds,t))return; s.checks[k]=true;s.glimmer+=val;s.lifetime+=val;save();toast("💠 +"+val+" Glimmer");renderToday()}
function fullDay(d){let ts=tasksFor(d);return ts.length&&ts.every(([t])=>isChecked(dk(d),t))}
function streakAtLeast(n,d){let count=0;for(let i=0;i<30;i++){let x=new Date(d);x.setDate(d.getDate()-i);if(fullDay(x))count++;else break}return count>=n}
function countCompletedFridays(){let c=0;for(let i=0;i<180;i++){let d=new Date();d.setDate(d.getDate()-i);if(d.getDay()===5&&fullDay(d))c++}return c}
function taskRow(t,val,ds){let r=document.createElement("label");r.className="row";let c=document.createElement("input");c.type="checkbox";c.checked=isChecked(ds,t);let sp=document.createElement("span");sp.textContent=t.replace(/^[🌅🌙🧽⭐] /,"");if(c.checked)sp.className="done";r.append(c,sp);let tag=document.createElement("span");tag.className="tag";tag.textContent="💠 "+val;r.append(tag);c.onchange=()=>{if(c.checked)completeTask(ds,t,val);else{delete s.checks[ds+"|"+t];s.glimmer=Math.max(0,s.glimmer-val);s.lifetime=Math.max(0,s.lifetime-val);save();renderToday()}};return r}
function renderToday(){let d=now(),ds=dk(d),ts=tasksFor(d),done=ts.filter(([t])=>isChecked(ds,t)).length;app.innerHTML=`<section class="card"><div class="hero"><div><div class="eyebrow">DAILY OBJECTIVES</div><h2>${fmt(d)}</h2><div class="rank">GUARDIAN RANK ${xpRank()}</div></div><div style="text-align:right"><div class="balance">💠 ${s.glimmer.toLocaleString()}</div><div class="small">GLIMMER</div></div></div><div class="progress"><div class="bar" style="width:${done/ts.length*100}%"></div></div><div class="small">${done} of ${ts.length} objectives complete</div></section>`;
let groups=[["🌅 Morning",ts.filter(x=>x[0].startsWith("🌅 "))],["🧹 Objectives",ts.filter(x=>!x[0].startsWith("🌅 ")&&!x[0].startsWith("🌙 "))],["🌙 Night",ts.filter(x=>x[0].startsWith("🌙 "))]];groups.forEach(([name,list])=>{let card=document.createElement("section");card.className="card";card.innerHTML=`<h2>${name}</h2>`;list.forEach(([t,v])=>card.appendChild(taskRow(t,v,ds)));app.append(card)});}
function renderCalendar(){let d=now(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let h=`<section class="card"><h2>${d.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2><div class="grid">`;["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(x=>h+=`<div class="weekday">${x}</div>`);for(let i=0;i<first;i++)h+="<div></div>";for(let n=1;n<=days;n++){let x=new Date(y,m,n),ts=tasksFor(x),done=ts.filter(([t])=>isChecked(dk(x),t)).length;h+=`<div class="day ${dk(x)===dk(d)?"today":""}"><strong>${n}</strong><div class="small">${done}/${ts.length}</div>${done?"<span class='dot'></span>":""}${x.getDay()===4||x.getDay()===5?"<span class='dot'></span>":""}</div>`}h+="</div></section><section class='card'><div class='eyebrow'>WEEKLY OBJECTIVES</div><h3>Thursday / Friday</h3><div class='small'>Thursday: gear maintenance, quarters and Garden. Friday: larger cleanup objectives and deep-clean bounties.</div></section>";app.innerHTML=h}
function renderProgress(){let d=now(),done=0,total=0;for(let i=0;i<30;i++){let x=new Date(d);x.setDate(d.getDate()-i);let ts=tasksFor(x);total+=ts.length;done+=ts.filter(([t])=>isChecked(dk(x),t)).length}let pct=Math.round(done/total*100),st=0;for(let i=0;i<30;i++){let x=new Date(d);x.setDate(d.getDate()-i);if(fullDay(x))st++;else break}app.innerHTML=`<section class='card'><div class='eyebrow'>GUARDIAN RECORD</div><h2>Progress</h2><div class='statgrid'><div class='stat'><div class='big'>💠 ${s.glimmer.toLocaleString()}</div><div class='small'>current glimmer</div></div><div class='stat'><div class='big'>${xpRank()}</div><div class='small'>guardian rank</div></div><div class='stat'><div class='big'>🔥 ${st}</div><div class='small'>day streak</div></div></div><div class='progress'><div class='bar' style='width:${s.lifetime%1000/10}%'></div></div><div class='small'>${rankNext()} Glimmer until Rank ${xpRank()+1} • Lifetime Glimmer: ${s.lifetime.toLocaleString()}</div></section><section class='card'><div class='eyebrow'>TRIUMPHS</div><h2>Achievements</h2>${triumphs.map((x,i)=>{let ok=x[3](d);return `<div class='reward'><span>${ok?"🏆":"○"} <b>${x[0]}</b><br><span class='small'>${x[1]}</span></span><span class='glimmer'>${ok?"CLAIMED":"💠 +"+x[2]}</span></div>`}).join("")}</section>`}
function renderRewards(){app.innerHTML=`<section class='card'><div class='eyebrow'>REWARD VAULT</div><div class='hero'><div><h2>Spend your Glimmer</h2><div class='small'>Balance</div></div><div class='balance'>💠 ${s.glimmer.toLocaleString()}</div></div>${s.rewards.map((r,i)=>`<div class='reward'><span>${r.icon} <b>${r.name}</b><br><span class='small'>Cost: ${r.cost.toLocaleString()} Glimmer</span></span><button class='${s.glimmer>=r.cost?"primary":"secondary"}' ${s.glimmer<r.cost?"disabled":""} onclick='claim(${i})'>Claim</button></div>`).join("")}</section><section class='card'><h2>Create Custom Reward</h2><input id='rname' type='text' placeholder='Reward name'><div class='actions'><input id='rcost' type='text' inputmode='numeric' placeholder='Glimmer cost'><button class='primary' onclick='addReward()'>Add Reward</button></div></section>`}
function claim(i){let r=s.rewards[i];if(s.glimmer<r.cost)return;s.glimmer-=r.cost;s.claimed[r.name]=(s.claimed[r.name]||0)+1;save();toast("🎁 Reward claimed: "+r.name);renderRewards()}
function addReward(){let n=document.getElementById("rname").value.trim(),c=parseInt(document.getElementById("rcost").value,10);if(!n||!c||c<1){alert("Enter a reward and a Glimmer cost.");return}s.rewards.push({name:n,cost:c,icon:"🎁"});save();renderRewards()}
function renderSettings(){app.innerHTML=`<section class='card'><div class='eyebrow'>APPEARANCE</div><h2>Theme</h2><div class='themegrid'><button class='theme ${s.theme==="guardian"?"selected":""}' onclick='setTheme("guardian")'>🌌<br><b>Guardian</b><br><span class='small'>Dark sci-fi</span></button><button class='theme ${s.theme==="light"?"selected":""}' onclick='setTheme("light")'>☀️<br><b>Light</b><br><span class='small'>Clean & bright</span></button></div></section><section class='card'><h2>Reminder times</h2>${setting("Morning routine","morning")}${setting("Main chores","cleaning")}${setting("Plant reminder","plants")}${setting("Night routine","night")}<div class='actions'><button class='primary' onclick='notify()'>Enable notifications</button></div></section><section class='card'><h2>Add recurring objective</h2><input id='cn' type='text' placeholder='Example: Take out recycling'><div class='actions'><input id='cv' type='text' inputmode='numeric' placeholder='Glimmer'><button class='primary' onclick='addCustom()'>Add objective</button></div><div class='small' style='margin-top:7px'>Added objectives repeat every day. You can remove them below.</div>${s.custom.map((x,i)=>`<div class='reward'><span>⭐ ${x.name}<br><span class='small'>💠 ${x.value}</span></span><button class='secondary danger' onclick='delCustom(${i})'>Delete</button></div>`).join("")}</section><section class='card'><h2>Data</h2><button class='secondary danger' onclick='resetAll()'>Reset all app data</button></section>`}
function setting(label,id){return `<div class='setting'><span>${label}</span><input type='time' value='${s.settings[id]}' onchange="s.settings['${id}']=this.value;save()"></div>`}
function setTheme(t){s.theme=t;save();applyTheme();renderSettings()}
function applyTheme(){if(s.theme==="light"){document.documentElement.style.setProperty("--bg","#f4f3ef");document.documentElement.style.setProperty("--card","#fff");document.documentElement.style.setProperty("--card2","#faf9f5");document.documentElement.style.setProperty("--ink","#1d1d1f");document.documentElement.style.setProperty("--muted","#707070");document.documentElement.style.setProperty("--line","#dedbd3");document.documentElement.style.setProperty("--accent","#9a6b16");document.documentElement.style.setProperty("--blue","#386f9e");document.documentElement.style.setProperty("--green","#3c7b5a")}else{document.documentElement.style.setProperty("--bg","#0d1018");document.documentElement.style.setProperty("--card","#171c27");document.documentElement.style.setProperty("--card2","#1d2432");document.documentElement.style.setProperty("--ink","#f1f3f7");document.documentElement.style.setProperty("--muted","#9ca6b7");document.documentElement.style.setProperty("--line","#2c3546");document.documentElement.style.setProperty("--accent","#d8a93e");document.documentElement.style.setProperty("--blue","#5fa8e8")}}
function addCustom(){let n=document.getElementById("cn").value.trim(),v=parseInt(document.getElementById("cv").value,10)||15;if(!n)return;s.custom.push({name:n,value:v,days:[0,1,2,3,4,5,6]});save();renderSettings()}
function delCustom(i){s.custom.splice(i,1);save();renderSettings()}
function resetAll(){if(confirm("Reset all Glimmer, check-offs, rewards and custom objectives?")){localStorage.removeItem(KEY);location.reload()}}
async function notify(){if(!("Notification"in window)){alert("Notifications aren't supported here.");return}let p=await Notification.requestPermission();alert(p==="granted"?"Notifications enabled. For the most reliable iPhone behavior, keep this installed on your Home Screen.":"Notifications were not enabled.")}
function show(t){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));t==="today"?renderToday():t==="calendar"?renderCalendar():t==="progress"?renderProgress():t==="rewards"?renderRewards():renderSettings()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.tab));headerDate.textContent=fmt(now());applyTheme();show("today");
</script></body></html>
